# 개발용. Postgres 만 컨테이너로 띄우고 앱은 IDE 에서 실행한다.
# 운영용 compose 는 Phase 2 에서 별도로 만든다.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: site
      POSTGRES_USER: site
      POSTGRES_PASSWORD: site
    ports:
      - "127.0.0.1:5432:5432"   # 로컬 개발이므로 루프백에만 바인딩
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
